version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefer-offline --include=dev
        # Write secrets from Amplify branch env vars into .env.production
        # so the SSR Lambda reads them at runtime.
        # Values come from Amplify Console → branch env vars — never committed to git.
        - echo "DATABASE_URI=$DATABASE_URI" >> .env.production
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "PAYLOAD_SECRET=$PAYLOAD_SECRET" >> .env.production
        - echo "NEXT_PUBLIC_SERVER_URL=$NEXT_PUBLIC_SERVER_URL" >> .env.production
        - echo "S3_BUCKET=$S3_BUCKET" >> .env.production
        - echo "S3_REGION=$S3_REGION" >> .env.production
        - echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> .env.production
        - echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> .env.production
        - echo "NEXT_PUBLIC_CDN_URL=$NEXT_PUBLIC_CDN_URL" >> .env.production
        # Run pending migrations against the RDS database before building
        - DATABASE_URI=$DATABASE_URI npx payload migrate
    build:
      commands:
        - npx cross-env NODE_OPTIONS="--no-deprecation --max-old-space-size=8000" next build --webpack
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
